name: Bug report
description: Report a reproducible AFTERTIDE defect
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected behavior and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Commit, engine version, OS, renderer and hardware
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots (remove private data)
